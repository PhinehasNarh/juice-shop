name: "ZAP Baseline Scan"

on:
  schedule:
    - cron:  '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan a self-hosted Juice Shop instance
    steps:
      - name: Check out Git repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Start Juice Shop container
        run: |
          docker pull bkimminich/juice-shop
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop to be ready
        run: |
          echo "Waiting for Juice Shop to start..."
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "Juice Shop is up!"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Juice Shop did not become ready in time"
          docker logs juice-shop
          exit 1

      - name: ZAP Baseline Scan
        run: |
          docker run --network=host \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -w /zap/wrk/zap-report.md \
            -c /zap/wrk/.zap/rules.tsv \
            -a -j || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            zap-report.html
            zap-report.json
            zap-report.md
          if-no-files-found: warn

      - name: Stop Juice Shop container
        if: always()
        run: docker rm -f juice-shop || true
